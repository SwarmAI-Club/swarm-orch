<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmAI — Client Portal</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--acc:#22d3ee;--acc2:#a855f7;--ok:#22c55e;--txt:#e5e7eb;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:760px;width:100%;background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:26px}
h1{font-size:1.4rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
label{display:block;color:var(--muted);font-size:.8rem;margin:10px 0 4px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #1f2937;background:#0b1220;color:var(--txt);font-size:.95rem}
button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#06121a;font-weight:800;font-size:.95rem;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;background:#1f2937;color:var(--muted);cursor:pointer}
.tab.active{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#06121a;font-weight:700}
.hide{display:none}
.card{background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:14px;margin-top:12px}
.stat{display:flex;justify-content:space-between;align-items:center}
.big{font-size:1.9rem;font-weight:800;color:var(--ok)}
code{background:#1f2937;padding:2px 6px;border-radius:5px;font-size:.82rem;word-break:break-all}
pre{background:#0b1220;border:1px solid #1f2937;border-radius:8px;padding:10px;font-size:.74rem;max-height:240px;overflow:auto;color:#b9cbe0;white-space:pre-wrap}
.err{color:#ef4444;font-size:.85rem;margin-top:8px;min-height:18px}
.muted{color:var(--muted);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th,td{text-align:left;padding:6px 7px;border-bottom:1px solid #1f2937}
th{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐝 SwarmAI Client Portal</h1>
  <div class="sub">Login → 攞 API token → 睇你嘅 SWAI 點數（瞓覺就賺 · 用 AI 就扣）</div>

  <div class="tabs">
    <div class="tab active" data-t="login">登入</div>
    <div class="tab" data-t="signup">開新帳戶</div>
  </div>

  <div id="p-login">
    <label>Email</label><input id="li-email" type="email" placeholder="you@example.com">
    <label>Password</label><input id="li-pass" type="password" placeholder="******">
    <button onclick="doLogin()">登入 → 攞 token</button>
    <div style="text-align:center;margin-top:8px"><a href="#" onclick="toggleForgot();return false" style="color:var(--acc);font-size:.85rem">忘記密碼？</a></div>
  </div>
  <div id="p-forgot" class="hide">
    <label>Email（收重置郵件）</label><input id="fg-email" type="email" placeholder="you@example.com">
    <button onclick="doForgot()">發送重置連結</button>
    <div class="muted" id="fg-status" style="margin-top:8px"></div>
    <div style="text-align:center;margin-top:8px"><a href="#" onclick="backLogin();return false" style="color:var(--acc);font-size:.85rem">← 返去登入</a></div>
  </div>
  <div id="p-reset" class="hide">
    <label>新密碼（最少 13 位：大階+細階+數字+符號）</label><input id="rs-pass" type="password">
    <button onclick="doReset()">重置密碼</button>
    <div class="muted" id="rs-status" style="margin-top:8px"></div>
  </div>

  <div id="p-signup" class="hide">
    <label>Email</label><input id="su-email" type="email" placeholder="you@example.com">
    <label>Password（最少 8 位）</label><input id="su-pass" type="password" placeholder="******">
    <button onclick="doSignup()">開戶 → 派 token</button>
  </div>
  <div class="err" id="err"></div>

  <div id="dash" class="hide">
    <div class="card">
      <div class="stat">
        <div><div class="muted">SWAI 點數（off-chain）</div><div class="big" id="bal">—</div></div>
        <div style="text-align:right"><div class="muted">node_id</div><div><code id="nodeid">—</code></div></div>
      </div>
      <div style="margin-top:10px"><div class="muted">你嘅 API token（X-Swarm-Token）</div><code id="tok">—</code></div>
      <div style="margin-top:8px"><div class="muted">用呢條 token 落 worker：<code style="background:#0b1220">--token "&lt;上面&gt;" --node-id &lt;node_id&gt;</code></div></div>
    </div>
    <div class="card"><div class="muted" style="margin-bottom:8px">最近分錄（mint/burn）</div><pre id="led"><span class="muted">loading…</span></pre></div>
    <div class="card"><div class="muted" style="margin-bottom:8px">🔑 分享 Keys（每把 Key 都會扣同一個 SWAI 池；可獨立 revoke）</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="key-label" placeholder="例如 team-mate / office" style="flex:1">
        <button style="width:auto;padding:9px 16px;margin:0" onclick="createKey()">加 Key</button>
      </div>
      <table><thead><tr><th>label</th><th>token</th><th></th></tr></thead><tbody id="keys"></tbody></table>
    </div>
    <button onclick="logout()">登出</button>
  </div>
</div>

<script>
const T = { login: 'login', signup: 'signup' };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.getElementById('p-login').classList.toggle('hide', t.dataset.t!=='login');
  document.getElementById('p-signup').classList.toggle('hide', t.dataset.t!=='signup');
  document.getElementById('err').textContent='';
});
function E(id){return document.getElementById(id)}
async function api(path, body, token){
  const r = await fetch(path, {method:'POST', headers:{'content-type':'application/json', ...(token?{'x-swarm-token':token}:{})}, body: JSON.stringify(body)});
  return r.json();
}
function toggleForgot(){ document.getElementById("p-login").classList.add("hide"); document.getElementById("p-forgot").classList.remove("hide"); }
function backLogin(){ document.getElementById("p-forgot").classList.add("hide"); document.getElementById("p-login").classList.remove("hide"); }
async function doForgot(){
  const r = await fetch('/portal/forgot', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({email: E('fg-email').value})});
  const d = await r.json();
  E('fg-status').textContent = d.hint || '已處理';
}
// 如果 URL 帶 ?code= → 顯示重置 form
(function(){ const m=(location.search.match(/[?&]code=([^&]+)/)||[])[1]; if(m){ window.__resetCode=m; document.getElementById("p-login").classList.add("hide"); document.getElementById("p-reset").classList.remove("hide"); } })();
async function doReset(){
  const r = await fetch('/portal/reset', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({code: window.__resetCode, password: E('rs-pass').value})});
  const d = await r.json();
  E('rs-status').textContent = d.ok ? '✅ '+d.message : '❌ '+d.error;
}
async function doLogin(){
  const d = await api('/portal/login', {email:E('li-email').value, password:E('li-pass').value});
  if(!d.ok){E('err').textContent = '('+d.error+')'; return;}
  enter(d);
}
async function doSignup(){
  const d = await api('/portal/signup', {email:E('su-email').value, password:E('su-pass').value});
  if(!d.ok){E('err').textContent = '('+d.error+')'; return;}
  E('err').textContent='✅ 開戶成功，token 已派';
  enter(d);
}
function enter(d){
  window.__tok = d.api_token;
  E('bal').textContent = d.balance ?? '0';
  E('nodeid').textContent = d.node_id;
  E('tok').textContent = window.__tok;
  E('dash').classList.remove('hide');
  document.getElementById('p-login').classList.add('hide');
  document.getElementById('p-signup').classList.add('hide');
  loadMe();
  setInterval(loadMe, 15000);
}
async function loadMe(){
  try{
    const r = await fetch('/portal/me', {headers:{'x-swarm-token':window.__tok}});
    const d = await r.json();
    if(!d.ok){E('led').textContent='token 已失效，請重新登入'; return;}
    E('bal').textContent = d.balance;
    E('led').textContent = JSON.stringify(d.journal, null, 1);
    loadKeys();
  }catch(e){ E('led').textContent='load fail: '+e; }
}

async function loadKeys(){
  try{
    const r = await fetch('/portal/keys', {headers:{'x-swarm-token':window.__tok}});
    const d = await r.json();
    if(!d.ok){ E('keys').innerHTML=''; return; }
    E('keys').innerHTML = (d.keys||[]).map(k=>`<tr><td>${k.label||'—'}</td><td><code>${k.token}</code></td><td><button style="width:auto;padding:5px 12px;margin:0" onclick="revokeKey('${k.token}')">revoke</button></td></tr>`).join('');
  }catch(e){}
}
async function createKey(){
  const label = E('key-label').value || 'key';
  const r = await fetch('/portal/keys/create', {method:'POST', headers:{'content-type':'application/json','x-swarm-token':window.__tok}, body: JSON.stringify({label})});
  const d = await r.json();
  if(d.ok){ alert('新 Key（只顯示一次）：\n'+d.token); E('key-label').value=''; loadKeys(); } else alert('失敗: '+(d.error||''));
}
async function revokeKey(tok){
  if(!confirm('確認 revoke 呢把 Key？')) return;
  const r = await fetch('/portal/keys/revoke', {method:'POST', headers:{'content-type':'application/json','x-swarm-token':window.__tok}, body: JSON.stringify({token:tok})});
  const d = await r.json();
  alert(d.ok ? '已 revoke ✓' : '失敗: '+(d.error||''));
  loadKeys();
}

function logout(){ location.reload(); }
</script>
</body>
</html>
